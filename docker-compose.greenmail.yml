services:
  greenmail:
    image: greenmail/standalone:2.1.13
    container_name: greenmail-casos-especiales
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3110:3110"
      - "127.0.0.1:3143:3143"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.pop3
        -Dgreenmail.setup.test.imap
        -Dgreenmail.users=grupo01sa:grup001grup001*@pruebas.local
        -Dgreenmail.hostname=0.0.0.0
